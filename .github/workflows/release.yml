name: Release for MOD Desktop (linux-x86_64)

# Build whenever a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# The job produces a single `sitar-<version>-linux-x86_64.tar.gz` artifact and
# attaches it to a GitHub Release named after the tag.
on:
  push:
    tags:
      - 'v*'

# `contents: write` is required so the workflow can create the release.
permissions:
  contents: write

jobs:
  build:
    name: Build .lv2 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (including DPF submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config

      - name: Build the plugin
        run: make

      - name: Verify build artefacts
        run: |
          # The tag must match the VERSION file (make release keeps them in
          # sync), and the built TTL must actually embed that version.
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$VERSION"
          MICRO="${VERSION##*.}"
          grep -q "lv2:microVersion $MICRO" bin/sitar.lv2/sitar.ttl
          test -f bin/sitar.lv2/sitar.so
          test -f bin/sitar.lv2/manifest.ttl
          test -f bin/sitar.lv2/sitar.ttl
          test -f bin/sitar.lv2/modgui.ttl
          test -f bin/sitar.lv2/modgui/icon-sitar.html
          test -f bin/sitar.lv2/modgui/knobs/sitar-knob.png
          file bin/sitar.lv2/sitar.so

      - name: Package the bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip the leading 'v' (v0.1.0 -> 0.1.0)
          ARTIFACT="sitar-${VERSION}-linux-x86_64.tar.gz"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          tar -C bin -czf "$ARTIFACT" sitar.lv2
          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"
          ls -la "$ARTIFACT" "${ARTIFACT}.sha256"

      - name: Upload artifact to workflow run
        # Useful even if the release step fails — the .tar.gz stays
        # downloadable from the Actions tab for 90 days.
        uses: actions/upload-artifact@v4
        with:
          name: sitar-linux-x86_64
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The release is auto-named after the tag (e.g. v0.1.0). Notes are
          # auto-generated from commits since the previous release.
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          body: |
            Drop-in `.lv2` bundle for MOD Desktop on Linux x86_64.

            Install:
            ```bash
            tar xzf sitar-*-linux-x86_64.tar.gz
            mv sitar.lv2 ~/Documents/MOD\ Desktop/lv2/
            ```
            Then restart MOD Desktop.
