<div class="mod-pedal sitar-pedal{{{cns}}} mod-pedal-sitar mod-{{color}} {{color}}">

    <!-- Painted frame + panel ("Raga Night"). Pure decoration: it sits under the
         drag handle and ignores the mouse. Textures: see textures/PROVENANCE. -->
    <div class="sitar-deco">
        <div class="sitar-panel"></div>
        <div class="sitar-band sitar-band-t"></div>
        <div class="sitar-band sitar-band-b"></div>
        <div class="sitar-band sitar-band-l"></div>
        <div class="sitar-band sitar-band-r"></div>
        <div class="sitar-stud sitar-stud-tl"></div>
        <div class="sitar-stud sitar-stud-tr"></div>
        <div class="sitar-stud sitar-stud-bl"></div>
        <div class="sitar-stud sitar-stud-br"></div>
    </div>

    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="mod-plugin-brand"><h1>{{brand}}</h1></div>
    <div class="mod-plugin-name"><h1>{{label}}</h1></div>

    <!-- Bypass. The lotus IS the bypass light: mod-ui puts class "on" on it while
         the effect runs and "off" while bypassed (also for footswitch/MIDI/HMI
         toggles), and the CSS opens or folds the petals from that. The footswitch
         is a transparent hit area stacked exactly over it. -->
    <div class="mod-light on" mod-role="bypass-light">
        <svg class="sitar-lotus" viewBox="0 0 36 30" aria-hidden="true">
            <defs>
                <linearGradient id="sitar-g-brass" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff0c0"/><stop offset=".35" stop-color="#e2bd6e"/><stop offset="1" stop-color="#8a6222"/>
                </linearGradient>
                <radialGradient id="sitar-g-glow">
                    <stop offset="0" stop-color="#ffc24a" stop-opacity=".75"/><stop offset="1" stop-color="#ffc24a" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <circle class="sitar-lotus-glow" cx="18" cy="16" r="13" fill="url(#sitar-g-glow)"/>
            <ellipse class="sitar-lotus-pt" style="--a:-66deg" cx="18" cy="13.5" rx="3.6" ry="8.5" fill="url(#sitar-g-brass)" stroke="#5a3a0e" stroke-width=".6"/>
            <ellipse class="sitar-lotus-pt" style="--a:66deg" cx="18" cy="13.5" rx="3.6" ry="8.5" fill="url(#sitar-g-brass)" stroke="#5a3a0e" stroke-width=".6"/>
            <ellipse class="sitar-lotus-pt" style="--a:-33deg" cx="18" cy="13.5" rx="3.6" ry="8.5" fill="url(#sitar-g-brass)" stroke="#5a3a0e" stroke-width=".6"/>
            <ellipse class="sitar-lotus-pt" style="--a:33deg" cx="18" cy="13.5" rx="3.6" ry="8.5" fill="url(#sitar-g-brass)" stroke="#5a3a0e" stroke-width=".6"/>
            <ellipse class="sitar-lotus-pt" style="--a:0deg" cx="18" cy="13.5" rx="3.6" ry="8.5" fill="url(#sitar-g-brass)" stroke="#5a3a0e" stroke-width=".6"/>
            <path d="M7 25.5 Q18 29.5 29 25.5" fill="none" stroke="#c99a45" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
    </div>
    <div class="mod-footswitch" mod-role="bypass" title="Bypass"></div>

    <!-- User-scale editor trigger (top-right, mirrors the lotus; JS binds it by mod-role) -->
    <div class="sitar-editbtn" mod-role="sitar-edit-open" title="Edit user scales">&#9998;</div>

    <!-- Controls: selector bar, then two knob rows grouped by signal path
         (Input · Pitch · Resonance / Output · Strum). -->
    <div class="sitar-body">
        <div class="sitar-scale-bar">
            <label class="sitar-field">
                <span class="sitar-field-label">SCALE</span>
                <select class="sitar-select sitar-select-scale" mod-role="sitar-scale">
                    <optgroup label="Western">
                        <option value="major">Major</option>
                        <option value="natural-minor">Natural Minor</option>
                        <option value="harmonic-minor">Harmonic Minor</option>
                        <option value="melodic-minor">Melodic Minor</option>
                        <option value="dorian">Dorian</option>
                        <option value="phrygian">Phrygian</option>
                        <option value="lydian">Lydian</option>
                        <option value="mixolydian">Mixolydian</option>
                        <option value="locrian">Locrian</option>
                        <option value="major-pentatonic">Major Pentatonic</option>
                        <option value="minor-pentatonic">Minor Pentatonic</option>
                        <option value="blues">Blues</option>
                        <option value="pythagorean">Pythagorean</option>
                        <option value="chromatic-12tet">Chromatic (12-TET)</option>
                    </optgroup>
                    <optgroup label="Turkish Makams">
                        <option value="makam-rast">Rast</option>
                        <option value="makam-ussak">Uşşak</option>
                        <option value="makam-hicaz">Hicaz</option>
                        <option value="makam-saba">Saba</option>
                    </optgroup>
                    <optgroup label="Indian Ragas">
                        <option value="raga-yaman">Yaman</option>
                        <option value="raga-bhairav">Bhairav</option>
                        <option value="raga-bhairavi">Bhairavi</option>
                        <option value="raga-todi">Todi</option>
                        <option value="raga-marwa">Marwa</option>
                        <option value="raga-malkauns">Malkauns</option>
                    </optgroup>
                </select>
            </label>

            <label class="sitar-field">
                <span class="sitar-field-label">ROOT</span>
                <select class="sitar-select sitar-select-root" mod-role="sitar-root">
                    <option value="130.81">C</option>
                    <option value="138.59">C#</option>
                    <option value="146.83">D</option>
                    <option value="155.56">D#</option>
                    <option value="164.81">E</option>
                    <option value="174.61">F</option>
                    <option value="185.00">F#</option>
                    <option value="196.00">G</option>
                    <option value="207.65">G#</option>
                    <option value="220.00">A</option>
                    <option value="233.08">A#</option>
                    <option value="246.94">B</option>
                </select>
            </label>

            <label class="sitar-field">
                <span class="sitar-field-label">STEREO</span>
                <select class="sitar-select sitar-select-stereo" mod-role="sitar-stereo">
                    <option value="mono">Mono</option>
                    <option value="linear-narrow">Linear Narrow</option>
                    <option value="linear">Linear</option>
                    <option value="wide-narrow">Wide Narrow</option>
                    <option value="wide">Wide</option>
                </select>
            </label>

            <div class="sitar-field">
                <span class="sitar-field-label">TEST</span>
                <div class="sitar-btn mod-toggle off" title="Test scale (plucks each string)"
                     mod-role="input-control-port"
                     mod-port-symbol="audition"
                     mod-widget="switch">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.6 1.8 L10.4 6 L3.6 10.2 Z" fill="currentColor"/></svg>
                </div>
            </div>
        </div>

        <div class="sitar-sections">
            <div class="sitar-sec">
                <span class="sitar-sec-title">Input</span>
                <div class="sitar-sec-knobs">
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="gate"></div>
                        <span class="mod-knob-title">GATE</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="sensitivity"></div>
                        <span class="mod-knob-title">SENS</span>
                    </div>
                </div>
            </div>

            <div class="sitar-sec">
                <span class="sitar-sec-title">Pitch</span>
                <div class="sitar-sec-knobs">
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="num_active"></div>
                        <span class="mod-knob-title">STRINGS</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="octave"></div>
                        <span class="mod-knob-title">OCT</span>
                    </div>
                </div>
            </div>

            <div class="sitar-sec">
                <span class="sitar-sec-title">Resonance</span>
                <div class="sitar-sec-knobs">
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="decay"></div>
                        <span class="mod-knob-title">DECAY</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="bloom"></div>
                        <span class="mod-knob-title">BLOOM</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="jawari"></div>
                        <span class="mod-knob-title">JAWARI</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="sitar-sections">
            <div class="sitar-sec">
                <span class="sitar-sec-title">Output</span>
                <div class="sitar-sec-knobs">
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="lead_jawari"></div>
                        <span class="mod-knob-title">LEAD</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="mix"></div>
                        <span class="mod-knob-title">MIX</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="level"></div>
                        <span class="mod-knob-title">LEVEL</span>
                    </div>
                </div>
            </div>

            <div class="sitar-sec">
                <span class="sitar-sec-title">Strum</span>
                <div class="sitar-sec-knobs">
                    <div class="sitar-strum-btns">
                        <div class="sitar-btn mod-toggle off" title="Strum up (low to high)"
                             mod-role="input-control-port"
                             mod-port-symbol="strum_up"
                             mod-widget="switch">
                            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.2 V2 M2.4 5.4 L6 1.8 L9.6 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                        <div class="sitar-btn mod-toggle off" title="Strum down (high to low)"
                             mod-role="input-control-port"
                             mod-port-symbol="strum_down"
                             mod-widget="switch">
                            <svg viewBox="0 0 12 12" aria-hidden="true" style="transform:rotate(180deg)"><path d="M6 10.2 V2 M2.4 5.4 L6 1.8 L9.6 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="strum_time"></div>
                        <span class="mod-knob-title">SWEEP</span>
                    </div>
                    <div class="mod-knob sitar-knob">
                        <div class="mod-knob-image" mod-role="input-control-port" mod-port-symbol="strum_level"></div>
                        <span class="mod-knob-title">STRENGTH</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User-scale editor overlay (hidden until opened) -->
    <div class="sitar-editor" mod-role="sitar-editor" style="display:none;">
        <div class="sitar-editor-row">
            <span class="sitar-editor-title">USER SCALES</span>
            <div class="sitar-editor-close" mod-role="sitar-edit-close">&#10005;</div>
        </div>
        <div class="sitar-editor-row">
            <select class="sitar-select" mod-role="sitar-edit-slot"></select>
            <input class="sitar-editor-name" mod-role="sitar-edit-name" type="text" maxlength="31" placeholder="scale name" />
        </div>
        <input class="sitar-editor-ivals" mod-role="sitar-edit-ivals" type="text"
               placeholder="intervals: 9/8, 347.4, 4/3, 3/2 …  (ratios or cents)" />
        <div class="sitar-editor-row">
            <div class="sitar-editor-btn" mod-role="sitar-edit-save">Save</div>
            <div class="sitar-editor-btn" mod-role="sitar-edit-clear">Clear slot</div>
        </div>
    </div>

    <!-- Audio I/O — required structure for pedalboard connections -->
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}"
             mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>

</div>
